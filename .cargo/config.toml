# Vercel's Rust builder reads `build.target` from this file and fails if there is no [build]
# table at all, so keep this (empty) section.
[build]

# Use Rust's bundled (self-contained) MinGW linker on Windows GNU. A system MinGW on PATH
# (e.g. WinLibs) breaks when the user folder contains a space ("C:\Users\Mateo G").
#
# `erase_components` type-erases Leptos component views: identical HTML output, but far less
# monomorphized code (WASM 4.0 MB -> 2.2 MB) and much faster compiles.
[target.x86_64-pc-windows-gnu]
rustflags = ["-C", "link-self-contained=yes", "--cfg", "erase_components"]

[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"wasm_js\"", "--cfg", "erase_components"]

# Linux (Vercel's build machines): same type erasure so the deployed server matches local builds.
[target.x86_64-unknown-linux-gnu]
rustflags = ["--cfg", "erase_components"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["--cfg", "erase_components"]
